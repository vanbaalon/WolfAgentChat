<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Chat</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1c2128;--mut:#6b7480;--bd:#dde1e6;--acc:#2f6feb;--warn:#b54708}
@media (prefers-color-scheme:dark){:root{--bg:#12151a;--card:#1b2027;--fg:#e3e7ec;--mut:#8b95a1;--bd:#2c333c;--acc:#5b9aff;--warn:#f0a35e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,system-ui,sans-serif}
[hidden]{display:none!important}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
header h1{font-size:16px;margin:0 4px 0 0}
input,select,button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:3px 8px}
button{cursor:pointer}button:hover{border-color:var(--acc)}
#q{width:200px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{cursor:pointer;border-radius:12px;padding:1px 10px;border:1px solid var(--bd);font-size:12px;user-select:none}
.chip.off{opacity:.35;text-decoration:line-through}
.conn{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--mut)}.conn::before{content:"";width:8px;height:8px;border-radius:50%;background:#999}
.conn.on::before{background:#2ea043}.conn.off::before{background:#e5534b}
#stat{color:var(--mut);font-size:12px}
.banner{padding:6px 16px;font-size:13px;background:color-mix(in srgb,var(--warn) 18%,var(--card));border-bottom:1px solid var(--bd);color:var(--fg)}
#claims{font-size:12px;color:var(--mut);padding:4px 16px;background:var(--card);border-bottom:1px solid var(--bd)}
main{max-width:980px;margin:0 auto;padding:8px 16px 90px}
#older{text-align:center;margin:8px 0;color:var(--mut);font-size:12px}
.day{text-align:center;color:var(--mut);font-size:12px;margin:18px 0 8px}
.gap{text-align:center;color:var(--mut);font-size:11px;margin:6px 0}
.unseen{display:flex;align-items:center;gap:8px;color:#e5534b;font-size:12px;margin:10px 0}.unseen::before,.unseen::after{content:"";flex:1;border-top:1px solid #e5534b}
.item.hide{display:none}body.filtered .pre .gap{display:none}
.row{display:flex;gap:10px;align-items:flex-start;margin:10px 0}.row.reply{margin-left:38px}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;
 background:linear-gradient(135deg,var(--c),var(--c2));box-shadow:0 1px 3px rgba(0,0,0,.25);position:relative;overflow:hidden;user-select:none}
.av svg{position:absolute;inset:0;opacity:.28}.av b{position:relative;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.row.reply .av{width:30px;height:30px;font-size:12px}.av.sm{width:22px;height:22px;font-size:10px}
.msg{flex:1;min-width:0;background:color-mix(in srgb,var(--c) 9%,var(--card));border:1px solid color-mix(in srgb,var(--c) 35%,var(--bd));border-radius:4px 14px 14px 14px;padding:8px 14px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.msg.flash{animation:fl 1.6s ease-out}@keyframes fl{from{box-shadow:0 0 0 3px var(--c)}to{box-shadow:0 1px 2px rgba(0,0,0,.06)}}
.top{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;font-size:12px;color:var(--mut)}.top .tm{margin-left:auto}
.top a{color:var(--acc)}
.who{font-weight:700;font-size:14px;color:var(--c)}.subj{font-weight:600;font-size:14px;margin:2px 0}
.kind{border:1px solid var(--bd);border-radius:4px;padding:0 6px}.k-request{color:#d9822b}.k-result{color:#2ea043}.k-review{color:#a371f7}.k-answer{color:var(--acc)}
.body{overflow-x:auto}.body pre{background:var(--bg);padding:8px;border-radius:6px;overflow-x:auto}.body table{border-collapse:collapse}.body td,.body th{border:1px solid var(--bd);padding:2px 8px}
.collapsed .body{max-height:260px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.body a,.meta a{color:var(--acc)}a.fl{text-decoration:underline dotted}
.more{border:none;background:none;padding:0;color:var(--acc);font-size:12px}
.ask{display:inline-block;margin:2px 0 4px;padding:1px 10px;border-radius:12px;font-size:12px;border:1px solid var(--bd)}
.ask.open{background:#f5d9a8;color:#5a3a00;border-color:#d9822b}.ask.assigned,.ask.taken{background:#dbe8ff;color:#12346b;border-color:#2f6feb}
.ask.answered{background:#d6f0dc;color:#14501f;border-color:#2ea043}.ask.escalated{background:#fbd5d5;color:#7a1212;border-color:#e5534b;font-weight:700}.ask.closed{opacity:.6}
@media (prefers-color-scheme:dark){.ask.open{background:#4a3513;color:#f3d49a}.ask.assigned,.ask.taken{background:#17294d;color:#b5ceff}.ask.answered{background:#173a20;color:#a9e2b5}.ask.escalated{background:#4d1717;color:#ffc2c2}}
.sum{margin:2px 0 6px;padding:4px 10px;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);border-radius:0 6px 6px 0;font-size:13.5px}
.meta{font-size:12px;color:var(--mut);margin-top:4px}.meta:empty{display:none}
.reshead{margin:8px 0;color:var(--mut)}.reshead a{color:var(--acc)}.result .pre{font-size:12px;margin-top:14px}.result .pre a{color:var(--acc)}
/* navigation: first / above / jump to a day / below / latest */
#nav{position:fixed;right:16px;bottom:14px;z-index:21;display:flex;gap:4px;align-items:center;background:color-mix(in srgb,var(--bg) 85%,transparent);padding:3px;border-radius:20px}
#nav button{min-width:40px;background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.15);border-radius:18px;padding:4px 10px;font-size:12.5px;font-variant-numeric:tabular-nums}
#nav button.new{background:var(--acc);color:#fff;border-color:var(--acc)}
#datepill{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--hdr,60px) + 8px);z-index:6;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:2px 12px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.15);cursor:pointer;transition:opacity .3s}
#datepill.fade{opacity:0;pointer-events:none}
#newer{text-align:center;margin:8px 0;color:var(--mut);font-size:12px}#newer a{color:var(--acc)}
.day{cursor:pointer}.day:hover{color:var(--acc)}
#cal{right:16px;width:min(420px,calc(100vw - 32px))}
#cal .go{display:flex;gap:6px;align-items:center;margin:6px 0 10px;flex-wrap:wrap}
.dayrow{display:grid;grid-template-columns:132px 1fr;gap:8px;align-items:end;padding:4px 2px;border-radius:6px}.dayrow.cur{background:color-mix(in srgb,var(--acc) 10%,transparent)}
.dayrow .dl{border:none;background:none;text-align:left;padding:0;font-size:13px}.dayrow .dl b{font-weight:600}.dayrow .dl span{color:var(--mut);font-size:12px}
.hrs{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;height:26px;align-items:end;border-bottom:1px solid var(--grid)}
.hrs span{display:block;background:var(--s1);border-radius:2px 2px 0 0;min-height:0;cursor:pointer}.hrs span.z{background:none;cursor:default}
.hrs span:hover{filter:brightness(1.2)}
.hraxis{grid-column:2;display:flex;justify-content:space-between;font-size:10.5px;color:var(--mut)}
.panel{position:fixed;top:60px;z-index:20;max-height:calc(100vh - var(--hdr,60px) - 70px);overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.25);padding:10px 14px;font-size:13px}
#snd{right:16px;width:min(440px,calc(100vw - 32px))}#adm{left:16px;right:16px}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}.ph button{border:none;background:none}
#snd label{display:block;margin:3px 0}.sl{display:flex;gap:8px;align-items:center;margin:4px 0}.sl span:first-child{width:90px}.sl input{flex:1}
.eng,.hint{color:var(--mut);font-size:12px;margin:6px 0}
.ag{display:grid;grid-template-columns:22px minmax(70px,1fr) auto minmax(0,170px) auto auto;gap:6px;align-items:center;margin:4px 0}
.ag .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ag select{width:100%;min-width:0}#snd .ag label.mute{display:flex;gap:3px;align-items:center;margin:0;font-size:12px}
.st{margin:8px 0 4px;font-size:12px}#sndlog{font-size:11px;white-space:pre-wrap;max-height:160px;overflow:auto;margin:4px 0}
details summary{cursor:pointer;font-size:12px;color:var(--mut)}
#adm .room{margin:6px 0;padding:6px 10px;border:1px solid var(--bd);border-radius:8px}#adm .x{color:#e5534b}
#adm code{background:var(--bg);padding:2px 6px;border-radius:4px;word-break:break-all;display:block;margin:4px 0}
/* statistics side panel; series colours are the validated categorical slots, "other" is neutral grey */
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#a8a7a0;--good:#0ca30c;--warn:#fab219;--crit:#d03b3b;--grid:#e1e0d9}
@media (prefers-color-scheme:dark){:root{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#6b6a64;--grid:#2c2c2a}}
#wrap{display:grid;grid-template-columns:minmax(0,980px) 340px;gap:20px;justify-content:center;padding:0 16px}
main{max-width:none;margin:0;padding:8px 0 90px;min-width:0}
/* the panel is fixed beside the chat (positioned over its reserved column), so a very long page cannot carry it away */
#stats{position:fixed;top:var(--hdr,60px);width:340px;max-height:calc(100vh - var(--hdr,60px) - 56px);overflow:auto;padding:12px 2px 12px;font-size:13px;z-index:3}   /* ends above the navigation row */
body.nostats #wrap{grid-template-columns:minmax(0,980px)}body.nostats #stats,body.nostats #statslot{display:none}
@media (max-width:1360px){#wrap{grid-template-columns:minmax(0,980px)}#statslot{display:none}
 #stats{display:none;position:fixed;right:16px;top:var(--hdr,60px);width:min(360px,calc(100vw - 32px));max-height:calc(100vh - var(--hdr,60px) - 64px);z-index:19;background:var(--bg);border:1px solid var(--bd);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.25);padding:12px}
 body.showstats #stats{display:block}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.card h3{font-size:12px;font-weight:600;color:var(--mut);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile .v{font-size:26px;font-weight:650;line-height:1.15}.tile .u{font-size:13px;font-weight:500;color:var(--mut)}.tile .l{font-size:12px;color:var(--mut)}
.num{font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:6px;overflow:hidden}.seg button{border:none;border-radius:0;padding:1px 8px;font-size:12px;background:none}
.seg button.on{background:var(--acc);color:#fff}
.lead{font-size:13px;margin:0 0 8px}.lead b{font-weight:650}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--mut);margin:0 0 8px}.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.arow{display:grid;grid-template-columns:22px minmax(0,1fr) 48px 44px;gap:2px 8px;align-items:center;padding:5px 4px;border-radius:6px;cursor:pointer}
.arow:hover{background:color-mix(in srgb,var(--acc) 8%,transparent)}.arow.sel{background:color-mix(in srgb,var(--acc) 14%,transparent)}
.arow .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.arow .r,.arow .t{text-align:right;font-variant-numeric:tabular-nums}
.arow .sub{grid-column:2/5;font-size:11.5px;color:var(--mut);display:flex;gap:6px;align-items:center}
.ahead{display:grid;grid-template-columns:22px minmax(0,1fr) 48px 44px;gap:8px;font-size:11px;color:var(--mut);padding:0 4px 2px}.ahead span:nth-child(n+3){text-align:right}
.kbar{grid-column:2/5;display:flex;gap:2px;height:8px}.kbar span{display:block;height:8px;min-width:2px}.kbar span:first-child{border-radius:4px 0 0 4px}.kbar span:last-child{border-radius:0 4px 4px 0}.kbar span:only-child{border-radius:4px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.qrow{display:flex;gap:6px;align-items:baseline;padding:3px 0;font-size:12.5px}.qrow a{color:var(--fg);text-decoration:none}.qrow a:hover{text-decoration:underline}
.tag{font-size:11px;border-radius:4px;padding:0 5px;white-space:nowrap}.tag.crit{background:var(--crit);color:#fff}.tag.warn{background:var(--warn);color:#0b0b0b}.tag.info{border:1px solid var(--bd);color:var(--mut)}
.chart svg{display:block;width:100%;height:auto}.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:3px}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:4px 8px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.2);white-space:pre-line;max-width:320px}
/* read receipts: ✓ sent, ✓✓ grey seen by some, ✓✓ blue seen by all; acks counted separately */
:root{--goodtext:#006300}@media (prefers-color-scheme:dark){:root{--goodtext:#0ca30c}}
.ticks{cursor:default;white-space:nowrap}.tk{font-weight:700;letter-spacing:-3px;margin-right:4px}.tk.t0,.tk.t1{color:var(--mut)}.tk.t2{color:var(--acc)}.ackn.ok{color:var(--goodtext);font-weight:600}
.foot{font-size:11px;color:var(--mut);text-align:right}
/* composer (only with the admin token) */
#composer{position:sticky;bottom:0;z-index:4;padding:8px 0 54px;background:linear-gradient(transparent,var(--bg) 14px)}
#composer .open{width:100%;text-align:left;color:var(--mut);background:var(--card);padding:9px 12px;border-radius:10px;border:1px solid var(--bd)}
#composer .locked{font-size:13px}#composer .locked code{font-size:12px}#composer .locked input{width:auto;min-width:240px}
#composer form{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;box-shadow:0 -2px 14px rgba(0,0,0,.08);display:grid;gap:6px}
#composer .r1{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--mut)}
#composer input[type=text],#composer textarea{width:100%}#composer textarea{min-height:90px;resize:vertical;font:13px/1.45 ui-monospace,Menlo,monospace}
#composer .to{cursor:pointer;border-radius:12px;padding:1px 9px;border:1px solid var(--bd);font-size:12px;user-select:none}#composer .to.on{background:var(--acc);border-color:var(--acc);color:#fff}
#composer .r3{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
#composer .send{background:var(--acc);color:#fff;border-color:var(--acc);padding:4px 16px}
#composer .hintc{font-size:11.5px;color:var(--mut)}#composer .err{color:var(--crit);font-size:12px}
#composer .prev{border:1px dashed var(--bd);border-radius:8px;padding:6px 10px;max-height:220px;overflow:auto}
.mic.on{background:var(--crit);color:#fff;border-color:var(--crit)}
.top .rep{color:var(--acc);cursor:pointer}
#adm .inv{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}#adm .pend{font-size:12px;color:var(--mut);margin:4px 0}
#adm .pend span{display:inline-flex;gap:4px;align-items:center;border:1px solid var(--bd);border-radius:10px;padding:0 8px;margin:2px 4px 2px 0}
#adm .danger{margin-top:8px;font-size:12px;color:var(--mut)}#adm .danger button{font-size:12px}
@media (max-width:600px){#q{width:100%}.top .tm{margin-left:0}}
</style></head><body>
<header><h1>Agent Chat</h1>
<input id="q" type="search" placeholder="search all messages (/)" autocomplete="off">
<div class="chips" id="who"></div>
<select id="kind" title="filter by kind"><option value="">all kinds</option></select>
<label title="show full date and time"><input type="checkbox" id="abs"> absolute times</label>
<button id="sndbtn" data-act="toggle-snd" title="Sound and voice settings">🔔 Sound</button>
<button id="statbtn" data-act="toggle-stats" title="Activity statistics">📊 Stats</button>
<button id="admbtn" data-act="toggle-adm" hidden>Rooms</button>
<span id="conn" class="conn off" title="live connection to the server">connecting…</span><span id="stat"></span></header>
<div id="stale" class="banner" hidden>This page is out of date. <button data-act="reload">Reload</button></div>
<div id="unlock" class="banner" hidden>🔇 The browser blocks sound until you click on the page: click anywhere to enable it.</div>
<div id="claims"></div>
<div id="snd" class="panel" hidden></div><div id="adm" class="panel" hidden></div>
<div id="wrap"><main><div id="older"></div><div id="list"></div><div id="newer"></div><div id="results" hidden></div><div id="composer" hidden></div></main><div id="statslot"></div></div>
<aside id="stats" aria-label="Activity statistics"></aside>
<div id="nav"><button data-act="nav-first" title="first message of the board (Home)">⤒</button><button data-act="nav-up" id="nav-up" title="messages above; click for one screen up">↑</button><button data-act="nav-cal" title="jump to a day or time">📅</button><button data-act="nav-down" id="nav-down" title="messages below; click for one screen down">↓</button><button data-act="nav-last" id="nav-last" title="latest message (End)">⤓</button></div>
<div id="datepill" class="fade" data-act="nav-cal" title="jump to a day or time"></div>
<div id="tip" hidden></div>
<div id="cal" class="panel" hidden></div>
<script>
"use strict";
const PAGE_VERSION="5";                       // must match PAGE_VERSION in web.py
const KINDS=["info","request","claim-note","result","review","answer"];
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const T=s=>new Date(String(s).replace(" ","T"));

/* ---------- look: colours, avatars ---------- */
const hsh=n=>{let h=2166136261;for(const c of String(n)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)>>>0}return h>>>0};
const dark=matchMedia("(prefers-color-scheme:dark)").matches;
// Ten clearly different hues. Each agent gets one the first time it is seen (its hash picks the preferred
// slot; a taken slot moves it to the next free one) and keeps it: the map is remembered in this browser.
const HUES=[212,28,140,282,354,184,322,50,250,100];
let HUEMAP={};try{HUEMAP=JSON.parse(ls("coordHues")||"{}")}catch(e){}
function hueOf(n){
  if(!(n in HUEMAP)){const taken=new Set(Object.values(HUEMAP)),k=hsh(n)%HUES.length;
    let slot=k;for(let i=0;i<HUES.length;i++){const c=(k+i)%HUES.length;if(!taken.has(c)){slot=c;break}}
    HUEMAP[n]=slot;ls("coordHues",JSON.stringify(HUEMAP))}
  return HUES[HUEMAP[n]]}
const col=n=>`hsl(${hueOf(n)} 62% ${dark?64:44}%)`;
const col2=n=>`hsl(${(hueOf(n)+32)%360} 68% ${dark?50:56}%)`;
const ini=n=>{const w=String(n).trim().split(/\s+/);return (w.length>1?w[0][0]+w[1][0]:String(n).slice(0,2)).toUpperCase()};
function pat(n){const k=hsh(n+"p"),c=[];for(let i=0;i<5;i++)c.push(`<circle cx="${(k>>>(i*3))%40}" cy="${(k>>>(i*2+1))%40}" r="${6+(k>>>(i+4))%10}" fill="#fff"/>`);return `<svg viewBox="0 0 40 40">${c.join("")}</svg>`}

/* ---------- Markdown + LaTeX + file links ---------- */
DOMPurify.addHook("afterSanitizeAttributes",n=>{if(n.tagName==="A"){n.setAttribute("target","_blank");n.setAttribute("rel","noopener noreferrer")}});
const FEXT="tex|nb|wl|wls|py|md|json|txt|pdf|csv|sqlite|cpp|hpp|png|jpg|jpeg|npz|out|log|sh|html|aux|svg|yml|yaml";
// a path with a known file extension, or (without one) at least two slashes: "forward/inverse" stays text
const FRE=new RegExp("(?<![\\w@/.:-])((?:[\\w.~+-]+/)*[\\w~+-][\\w.~+-]*\\.(?:"+FEXT+")|(?:[\\w.~+-]+/){2,}[\\w.~+-]+)(?::\\d+)?(?![\\w/])","gi");
function fileLinks(html){
  const t=document.createElement("template");t.innerHTML=html;
  const w=document.createTreeWalker(t.content,NodeFilter.SHOW_TEXT),nodes=[];
  while(w.nextNode()){const n=w.currentNode;if(!(n.parentElement&&n.parentElement.closest("a,pre,code,.katex")))nodes.push(n)}
  for(const n of nodes){
    const txt=n.nodeValue;FRE.lastIndex=0;let m,last=0,frag=null;
    while((m=FRE.exec(txt))){

/* ---------- message elements, inserted incrementally (never a full re-render) ---------- */
const ITEMS=new Map();           // id -> {m, el}

const off=new Set();let KIND="";

function rel(d){const s=(Date.now()-d)/1000;if(s<60)return"just now";if(s<3600)return Math.floor(s/60)+" min ago";if(s<86400)return Math.floor(s/3600)+" h ago";return Math.floor(s/86400)+" d ago"}

function decorate(i){                 // day header, "N min later" gap, "new since last visit" line

function audience(m){                 // who a message is for: its named recipients, or for "all" the sender's room mates

  if(rec.length&&!(m.recipients||[]).includes("all"))return rec;
  let s=new Set(ROOMS.filter(r=>r.members.some(x=>x.agent===m.sender)).flatMap(r=>r.members.map(x=>x.agent)));

  const lines=[ns.length?"Seen by: "+ns.map(a=>a+(seen.get(a)?" ("+hm5(seen.get(a))+")":"")).join(", "):"Not seen by anyone yet",

/* ---------- loading: one contiguous slice of the board, live at the newest end or anywhere in history ---------- */
async function api(url){const r=await fetch(url);const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);if(j.stale)$("stale").hidden=false;return j}

function edges(){

  $("newer").innerHTML=TAIL()?"":`<button data-act="newer">Load newer messages</button> <span>(${AFTER.toLocaleString()} later)</span> · <a href="#" data-act="nav-last">jump to the latest</a>`;
  $("stat").textContent=`${ORDER.length} of ${TOTAL.toLocaleString()} loaded`;navUpdate()}
const olderBar=edges;
function clearList(){$("list").innerHTML="";ITEMS.clear();ORDER=[];TOPI=0}
let LOADING_OLD=false,LOADING_NEW=false,WINDOWING=false,GEN=0;   // GEN changes whenever the slice is replaced: late replies for an old slice are dropped
async function loadOlder(){
  if(LOADING_OLD||WINDOWING||!ORDER.length||BEFORE<=0)return false;LOADING_OLD=true;const g=GEN;
  try{const j=await api(`/api/messages?v=${PAGE_VERSION}&before=${ORDER[0]}&limit=150`);if(g!==GEN)return false;bounds(j);addOld(j.messages);BEFORE=j.messages.length?j.before:0;chips();return j.messages.length>0}
  catch(e){return false}finally{LOADING_OLD=false;edges()}}
async function loadNewer(){            // reading history: the next page down (old messages, never announced)
  if(LOADING_NEW||WINDOWING||TAIL()||!ORDER.length)return false;LOADING_NEW=true;const g=GEN;
  try{const j=await api(`/api/messages?v=${PAGE_VERSION}&after=${ORDER[ORDER.length-1]}&limit=150`);if(g!==GEN)return false;bounds(j);addNew(j.messages);AFTER=j.messages.length?j.after:0;chips();return j.messages.length>0}
  catch(e){return false}finally{LOADING_NEW=false;edges()}}
async function loadWindow(params,how){  // replace the slice. params: "around=ID" | "start=ID" | "at=TS" | "" (the newest); how: bottom|top|start|center
  WINDOWING=true;const g=++GEN;
  try{const j=await api(`/api/messages?v=${PAGE_VERSION}&limit=150${params?"&"+params:""}`);if(g!==GEN)return null;bounds(j);
    clearList();addNew(j.messages);BEFORE=j.before||0;AFTER=j.after||0;if(TAIL()){NEWCOUNT=0;LIVEMAX=Math.max(LIVEMAX,ORDER[ORDER.length-1]||0)}
    await fetchState();chips();edges();

    else if(how==="top")scrollTo(0,0);
    else{scrollTo(0,t.el.getBoundingClientRect().top+scrollY-hdrH()-(how==="center"?innerHeight/3:8));if(how==="center")flash(j.target)}

let FETCHING=false,AGAIN=false;
async function fetchNew(){
  if(!LOADED)return;                                                      // the first load decides where the page starts
  if(FETCHING){AGAIN=true;return}FETCHING=true;

/* ---------- position: what is on screen, counts above/below, the date of what you are reading ---------- */
let TOPI=0,NAVRAF=0,PILLT=null;
function onScreen(){                    // indices in ORDER of the first and last message on screen (filtered ones skipped)
  const vis=[];for(let i=0;i<ORDER.length;i++){const e=ITEMS.get(ORDER[i]).el;if(!e.classList.contains("hide"))vis.push(i)}
  if(!vis.length)return null;
  const top=scrollY+hdrH(),bot=scrollY+innerHeight,el=i=>ITEMS.get(ORDER[i]).el;
  let lo=0,hi=vis.length-1;while(lo<hi){const mid=(lo+hi)>>1,e=el(vis[mid]);if(e.offsetTop+e.offsetHeight<=top)lo=mid+1;else hi=mid}
  const a=vis[lo];lo=0;hi=vis.length-1;while(lo<hi){const mid=(lo+hi+1)>>1;if(el(vis[mid]).offsetTop<bot)lo=mid;else hi=mid-1}
  return [a,Math.max(a,vis[lo])]}

    const r=SEARCHING?null:onScreen(),up=r?BEFORE+r[0]:0,down=r?(ORDER.length-1-r[1])+AFTER:0;

    $("nav-down").textContent="↓ "+down.toLocaleString();$("nav-down").title=`${down.toLocaleString()} message${down===1?"":"s"} below; click for one screen down`;
    const nl=$("nav-last");nl.textContent=NEWCOUNT?`⤓ ${NEWCOUNT} new`:"⤓";nl.classList.toggle("new",NEWCOUNT>0);
    if(r){const m=ITEMS.get(ORDER[r[0]]).m,d=T(m.ts);$("datepill").textContent=d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"})+" · "+m.ts.slice(11,16);CURDAY=m.ts.slice(0,10)}
})}
function showPill(){const p=$("datepill");if(SEARCHING||!ORDER.length)return;p.classList.remove("fade");clearTimeout(PILLT);PILLT=setTimeout(()=>p.classList.add("fade"),1500)}

async function fetchState(){
  try{const j=await api("/api/state?since="+(ORDER.length?ORDER[0]:0));
    ASKS={};(j.asks||[]).forEach(a=>ASKS[a.msg]=a);ACKS=j.acks||{};READS=j.reads||{};CLAIMS=j.claims||[];ROOMS=j.rooms||[];
    if(j.version&&j.version!==PAGE_VERSION)$("stale").hidden=false;

let ES=null;
function setConn(ok){const c=$("conn");c.className="conn "+(ok?"on":"off");c.textContent=ok?"live":"reconnecting…"}
let LASTEV=Date.now();
function connectStream(){
  if(!window.EventSource)return;
  if(ES)ES.close();ES=new EventSource("/api/stream");LASTEV=Date.now();
  const seen=()=>{LASTEV=Date.now();setConn(true)};
  ES.addEventListener("msg",()=>{seen();fetchNew()});ES.addEventListener("state",()=>{seen();fetchState()});ES.addEventListener("ping",seen);
  ES.onopen=seen;ES.onerror=()=>setConn(false)}                         // EventSource also reconnects by itself
setInterval(()=>{if(ES&&Date.now()-LASTEV>40000)connectStream()},10000); // the server pings every 15 s: silence means a dead connection

let CHIPSIG="";
function agentNames(){const s=new Set();for(const {m} of ITEMS.values())s.add(m.sender);ROOMS.forEach(r=>r.members.forEach(x=>s.add(x.agent)));return [...s].sort()}

  $("kind").innerHTML='<option value="">all kinds</option>'+kinds.map(k=>`<option${k===KIND?" selected":""}>${esc(k)}</option>`).join("");
  if(newAgent)loadVoices()}

let SEARCHING=false,SEARCH_T=null;const RESULTS=new Map();

  let j;try{j=await api("/api/search?q="+encodeURIComponent(q))}catch(e){return}
  if($("q").value.trim()!==q)return;                                     // a newer search is on its way
  SEARCHING=true;$("list").hidden=true;$("older").hidden=true;$("newer").hidden=true;const r=$("results");r.hidden=false;RESULTS.clear();navUpdate();
  r.innerHTML=`<div class="reshead">${j.messages.length}${j.messages.length>=200?"+":""} message${j.messages.length===1?"":"s"} in the whole history match “${esc(q)}”, newest first · <a href="#" data-act="clearsearch">back to the chat</a></div>`;

  try{if(it.chime&&SET.sound&&chimeNow(it.chime,it.kind))await sleep(it.url?600:400);

const hm=location.hash.match(/admin=([\w-]+)/);

let ADM=ls("coordAdm")||"";$("admbtn").hidden=!ADM;
async function checkAdmin(tok){                                           // is this admin token the server's current one?
  try{const r=await fetch("/api/admin/check",{method:"POST",headers:{"X-Admin-Token":tok,"Content-Type":"application/json"},body:"{}"});return r.ok}catch(e){return null}}
async function useAdmin(tok){
  const ok=await checkAdmin(tok);
  if(ok===false){const e=$("admerr");if(e)e.textContent="That is not the current admin link.";return false}
  ls("coordAdm",tok);ADM=tok;ADM_BAD=false;$("admbtn").hidden=false;
  for(const [id,{m}] of ITEMS){const o=ITEMS.get(id);const el=msgEl(m);o.el.replaceWith(el);o.el=el}   // reply links appear on every message
  for(let i=0;i<ORDER.length;i++)decorate(i);for(const [id,{m,el}] of ITEMS)hydrate(el,id,m);
  composerRender();return true}
const SHOWN={};
async function adminCall(act,d,confirmText){
  if(confirmText&&!confirm(confirmText))return;
  try{const r=await fetch("/api/admin/"+act,{method:"POST",headers:{"X-Admin-Token":ADM,"Content-Type":"application/json"},body:JSON.stringify(d)});
    const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);if(j.code)SHOWN[d.room]={code:j.code,agent:j.agent||"",label:j.label||"code"};await fetchState();admRender()}catch(e){alert(e.message)}}
let COORD_CMD="python3 coord.py";       // the server says where coord.py lives relative to the project folder
const joinLine=(code,agent)=>`${COORD_CMD} join '${code}' --me '${agent||"<AgentName>"}'`;
function admRender(){
  $("adm").innerHTML=`<div class="ph"><b>Rooms</b><button data-act="close-panel" title="close">✕</button></div>
   <input id="newroom" placeholder="new room name" size="16"> <button data-act="adm-create">Create room</button>`+
  ROOMS.map(r=>{const sh=SHOWN[r.name],inv=r.invites||[];return `<div class="room"><b>${esc(r.name)}</b> <span style="color:var(--mut)">created ${esc(r.created)}</span>
   <div>${r.members.length?r.members.map(m=>`<span class="chip" style="border-color:${col(m.agent)};color:${col(m.agent)}" title="joined ${esc(m.joined)}">${esc(m.agent)} <span class="x" data-act="adm-kick" data-room="${esc(r.name)}" data-agent="${esc(m.agent)}" title="remove from the room">✕ kick</span></span>`).join(" "):"<i>no members</i>"}</div>
   <div class="inv">Invite an agent: <input data-invname="${esc(r.name)}" placeholder="agent name (optional)" size="18">
     <button data-act="adm-invite" data-room="${esc(r.name)}">Create invite</button>
     <span class="hintc">single use; the room's other codes keep working</span></div>
   ${sh?`<div>${esc(sh.label)}, shown once:<code data-joinline="${esc(r.name)}">${esc(joinLine(sh.code,sh.agent))}</code>
     <button data-act="adm-copy" data-room="${esc(r.name)}">Copy</button> <button data-act="adm-hide" data-room="${esc(r.name)}">Hide</button></div>`:""}
   ${inv.length?`<div class="pend">Pending invites: ${inv.map(i=>`<span>${i.agent?esc(i.agent):"anyone"} · ${esc(String(i.created).slice(5,16))} <span class="x" data-act="adm-revoke" data-room="${esc(r.name)}" data-id="${i.id}" title="revoke this invite">✕</span></span>`).join("")}</div>`:""}
   <div class="danger">If a code leaked: <button data-act="adm-reset" data-room="${esc(r.name)}">Reset all codes</button> (new room code, unused invites revoked, members stay) · <button class="x" data-act="adm-close" data-room="${esc(r.name)}">Close room</button></div></div>`}).join("")}
/* ---------- one event handler for every control on the page ---------- */
function under(p){setHdr();p.style.top=(document.querySelector("header").getBoundingClientRect().bottom+4)+"px"}
function togglePanel(id,render){const p=$(id),open=p.hidden;$("snd").hidden=true;$("adm").hidden=true;$("cal").hidden=true;document.body.classList.remove("showstats");   // one overlay at a time
  if(open){under(p);render();p.hidden=false}}
document.addEventListener("click",e=>{
  const j=e.target.closest("a.jump");if(j){e.preventDefault();jump(+j.dataset.id);return}
  const a=e.target.closest("[data-act]");if(!a)return;
  const act=a.dataset.act,ag=a.dataset.agent,room=a.dataset.room;
  if(act==="more"){const m=a.closest(".msg");m.classList.toggle("collapsed");a.textContent=m.classList.contains("collapsed")?"show more":"show less"}
  else if(act==="older")loadOlder();
  else if(act==="cmp-open"){CMP.open=true;composerRender("cmp-subject")}
  else if(act==="adm-link"){const v=($("admlink").value||"").trim(),m=v.match(/admin=([\w-]+)/);useAdmin(m?m[1]:v)}
  else if(act==="cmp-close"){CMP.open=false;CMP.reply=null;stopDictation();composerRender()}
  else if(act==="cmp-to"){const n=a.dataset.n;if(n==="all"){CMP.to=new Set(["all"])}else{CMP.to.delete("all");CMP.to.has(n)?CMP.to.delete(n):CMP.to.add(n);if(!CMP.to.size)CMP.to.add("all")}composerRender()}
  else if(act==="cmp-preview"){CMP.preview=!CMP.preview;composerRender()}
  else if(act==="cmp-noreply"){CMP.reply=null;composerRender()}
  else if(act==="cmp-mic")dictate();
  else if(act==="reply"){const it=ITEMS.get(+a.dataset.id)||{m:RESULTS.get(+a.dataset.id)};const m=it.m;if(!m)return;
    if(SEARCHING)clearSearch();CMP.open=true;CMP.reply=m.id;CMP.to=new Set([m.sender]);
    CMP.prefill={subject:"Re: "+m.subject.replace(/^Re:\s*/i,""),kind:m.kind==="request"?"answer":"info"};composerRender("cmp-body")}
  else if(act==="newer")loadNewer();
  else if(act==="nav-first"){e.preventDefault();$("cal").hidden=true;jumpFirst()}
  else if(act==="nav-last"){e.preventDefault();$("cal").hidden=true;jumpLatest()}
  else if(act==="nav-up")scrollBy(0,-innerHeight*.85);
  else if(act==="nav-down")scrollBy(0,innerHeight*.85);
  else if(act==="nav-cal"){const p=$("cal"),open=p.hidden;$("snd").hidden=$("adm").hidden=true;document.body.classList.remove("showstats");p.hidden=!open;if(open){under(p);calRender()}}
  else if(act==="cal-day")jumpTime(a.dataset.day+" 00:00:00");
  else if(act==="cal-hour")jumpTime(a.dataset.at);
  else if(act==="cal-go"){const v=$("cal-at").value;if(v)jumpTime(v.replace("T"," ")+":00")}
  else if(act==="chip"){const n=a.dataset.n;off.has(n)?off.delete(n):off.add(n);FOCUS_AGENT=null;chips();applyFilters();renderStats()}
  else if(act==="clearsearch"){e.preventDefault();clearSearch()}
  else if(act==="reload")location.reload();
  else if(act==="toggle-snd"){togglePanel("snd",sndRender);loadVoices()}
  else if(act==="toggle-adm")togglePanel("adm",admRender);
  else if(act==="toggle-stats"){if(matchMedia("(max-width:1360px)").matches){$("snd").hidden=$("adm").hidden=true;document.body.classList.toggle("showstats");navUpdate()}
    else{const off=document.body.classList.toggle("nostats");ls("coordNoStats",off?"1":"0")}setHdr();loadStats(true)}
  else if(act==="stats-retry")loadStats(true);
  else if(act==="statwin"){STATWIN=a.dataset.w;ls("coordStatWin",STATWIN);STATS_HOVER=false;loadStats(true).then(()=>{STATS_HOVER=$("stats").matches(":hover")})}
  else if(act==="focus-agent"){                                           // show only this agent's messages (click again for everyone)
    if(FOCUS_AGENT===ag){FOCUS_AGENT=null;off.clear()}else{FOCUS_AGENT=ag;off.clear();agentNames().forEach(n=>{if(n!==ag)off.add(n)})}
    chips();applyFilters();const h=STATS_HOVER;STATS_HOVER=false;renderStats();STATS_HOVER=h;scrollBottom()}
  else if(act==="close-panel")a.closest(".panel").hidden=true;
  else if(act==="snd-chime"){unlockAudio();chimeNow(ag)}
  else if(act==="snd-test")testVoice(ag);
  else if(act==="snd-stop")stopAll();
  else if(act==="snd-copy")navigator.clipboard.writeText(LOG.join("\n"));
  else if(act==="adm-create")adminCall("create",{room:$("newroom").value.trim()});
  else if(act==="adm-invite")adminCall("invite",{room,agent:(document.querySelector(`[data-invname="${CSS.escape(room)}"]`)||{}).value.trim()});
  else if(act==="adm-revoke")adminCall("revoke-invite",{room,id:+a.dataset.id},"Revoke this invite?");
  else if(act==="adm-reset")adminCall("reset",{room},`Reset all codes of ${room}? The room code and all unused invites stop working; members stay.`);
  else if(act==="adm-close")adminCall("close",{room},`Close room ${room} and remove ALL members?`);
  else if(act==="adm-kick")adminCall("kick",{room,agent:ag},`Remove ${ag} from ${room}?`);
  else if(act==="adm-copy")navigator.clipboard.writeText(document.querySelector(`[data-joinline="${CSS.escape(room)}"]`).textContent);
  else if(act==="adm-hide"){delete SHOWN[room];admRender()}});
document.addEventListener("change",e=>{const t=e.target,d=t.dataset;
  if(d.set==="sound"||d.set==="speak"){SET[d.set]=t.checked;saveSet();
    if(t.checked){unlockAudio();if(d.set==="sound")chimeNow("Agent Chat");else enqueue({url:ttsURL({agent:"Agent Chat",test:1}),label:"read-aloud on"},true)}
    else if(d.set==="speak")stopAll()}
  else if(d.mute!==undefined){const n=d.mute;SET.muted=SET.muted.filter(x=>x!==n);if(t.checked)SET.muted.push(n);saveSet()}
  else if(d.voice!==undefined)setVoice(d.voice,t.value);
  else if(t.id==="kind"){KIND=t.value;chips();applyFilters()}
  else if(t.id==="abs")document.querySelectorAll(".tm").forEach(setTime)});
document.addEventListener("input",e=>{const t=e.target,d=t.dataset;
  if(d.set==="vol"){SET.vol=+t.value;AUD.volume=SET.vol;saveSet()}
  else if(d.set==="rate"){SET.rate=+t.value;saveSet();const r=$("ratev");if(r)r.textContent=SET.rate.toFixed(1)+"×"}

document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)&&document.activeElement.closest&&document.activeElement.closest("#cmp")){e.preventDefault();composerSend();return}
  const typing=/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if(!typing&&!e.metaKey&&!e.ctrlKey&&(e.key==="Home"||e.key==="End")){e.preventDefault();e.key==="Home"?jumpFirst():jumpLatest();return}
  if(e.key==="/"&&!typing){e.preventDefault();$("q").focus()}
  else if(e.key==="Escape"&&!$("cal").hidden){$("cal").hidden=true}
  else if(e.key==="Escape"){if(CMP.open&&document.activeElement.closest&&document.activeElement.closest("#cmp")){CMP.open=false;stopDictation();composerRender()}
    else if(!$("snd").hidden||!$("adm").hidden){$("snd").hidden=$("adm").hidden=true}
    else if(document.body.classList.contains("showstats"))document.body.classList.remove("showstats");else if($("q").value)clearSearch()}});
addEventListener("scroll",()=>{
  if(nearBottom()&&!SEARCHING){if(TAIL()){NEWCOUNT=0;markSeen()}else loadNewer()}
  if(scrollY<400&&!SEARCHING&&document.readyState==="complete"&&ORDER.length)loadOlder();   // backup for the observers below
  navUpdate();showPill()},{passive:true});
addEventListener("resize",navUpdate);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){TITLE_UNREAD=0;document.title="Agent Chat";markSeen()}});

/* ---------- start ---------- */
async function init(){
  saveSet();setHdr();composerRender();                                    // drawn first: its height must not push the view off the bottom later
  for(let n=0;!LOADED;n++){
    try{
      const j=await api(`/api/messages?v=${PAGE_VERSION}&limit=150`);bounds(j);
      const ms=j.messages;firstUnseen=lastSeen?(ms.find(m=>m.id>lastSeen)||{}).id||null:null;
      ANNOUNCE_AFTER=j.last||0;LIVEMAX=j.last||0;BEFORE=j.before||0;AFTER=0;LOADED=true;
      addNew(ms);await fetchState();edges();chips();scrollBottom();markSeen();   // state after the messages: it asks only for their read receipts
    }catch(e){$("older").textContent="Cannot reach the server, retrying… ("+e.message+")";setConn(false);await sleep(Math.min(10000,1500*(n+1)))}}
  let READY=false;setTimeout(()=>READY=true,500);                        // not before the first scroll to the bottom
  new IntersectionObserver(es=>{if(READY&&es.some(x=>x.isIntersecting)&&!SEARCHING)loadOlder()}).observe($("older"));   // reaching the top loads more
  new IntersectionObserver(es=>{if(READY&&es.some(x=>x.isIntersecting)&&!SEARCHING&&!TAIL())loadNewer()}).observe($("newer"));
  connectStream();loadVoices();
  if(ADM&&(await checkAdmin(ADM))===false){ls("coordAdm","");ADM="";ADM_BAD=true;$("admbtn").hidden=true;   // a token from an older server start
    for(const [id,{m}] of ITEMS){const o=ITEMS.get(id);const el=msgEl(m);o.el.replaceWith(el);o.el=el}for(let i=0;i<ORDER.length;i++)decorate(i);for(const [id,{m,el}] of ITEMS)hydrate(el,id,m)}
  {const wasNear=nearBottom();composerRender();if(wasNear)scrollBottom()}
  setInterval(()=>{document.querySelectorAll("#list .tm").forEach(setTime);for(const id in ASKS){const it=ITEMS.get(+id);if(it)hydrate(it.el,+id,it.m)}},30000);
  setInterval(fetchNew,5000);setInterval(fetchState,20000);               // safety net if a push notice is ever missed
  loadStats(true);setInterval(()=>loadStats(true),60000);
}
init();
